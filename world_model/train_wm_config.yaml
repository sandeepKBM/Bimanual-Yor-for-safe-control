# world_model/train_wm_config.yaml
#
# Config for OFFLINE DreamerV3 world-model-only training on our bimanual
# collection/ episodes, via the vendored dreamerv3-torch repo at
# /common/users/ss5772/dreamerv3 (NM512/dreamerv3-torch). Values mirror that
# repo's configs.yaml "defaults" block; only obs/action/data-path fields are
# bimanual-specific. Loaded by smoke_train_wm.py and (for a real run) by a
# thin real-training entrypoint -- see world_model/README.md for both.
#
# This does NOT drive dreamerv3-torch's own dreamer.py main() (that always
# builds a gym env via make_env() for observation/action-space discovery,
# which we don't have for this task -- see README.md "Offline support"
# section). Instead these keys are consumed directly by models.WorldModel,
# constructed with a hand-built obs_space/act_space that matches the shapes
# below -- no env, no online rollout, ever.

logdir: /common/users/ss5772/bimanual/world_model/logdir/wm_run_001
offline_traindir: /common/users/ss5772/bimanual/world_model/data/dreamer_fmt/train
offline_evaldir: /common/users/ss5772/bimanual/world_model/data/dreamer_fmt/eval
device: cuda:0
precision: 32
seed: 0

# Observation / action shapes (must match dataset_adapter.py's output).
size: [64, 64]
image_channels: 6          # rgb_head(3) + rgb_wrist_right(3), channel-concat
proprio_dim: 26            # left_q(6)+left_qd(6)+right_q(6)+right_qd(6)+
                            # left_gripper_state(1)+right_gripper_state(1)
                            # (object/cup pose is a separate "object_pose"
                            # LABEL field, NOT in proprio -- see
                            # world_model/dataset_adapter.py's object-pose-leak
                            # fix and docs/design/state_spaces.md)
num_actions: 16             # left_action(8) + right_action(8)

encoder:
  mlp_keys: 'proprio'
  cnn_keys: 'image'
  act: SiLU
  norm: True
  cnn_depth: 32
  kernel_size: 4
  minres: 4
  mlp_layers: 5
  mlp_units: 1024
  symlog_inputs: True

decoder:
  mlp_keys: 'proprio'
  cnn_keys: 'image'
  act: SiLU
  norm: True
  cnn_depth: 32
  kernel_size: 4
  minres: 4
  mlp_layers: 5
  mlp_units: 1024
  cnn_sigmoid: False
  image_dist: mse
  vector_dist: symlog_mse
  outscale: 1.0

# RSSM / world model (unchanged from dreamerv3-torch defaults).
dyn_hidden: 512
dyn_deter: 512
dyn_stoch: 32
dyn_discrete: 32
dyn_rec_depth: 1
dyn_mean_act: none
dyn_std_act: sigmoid2
dyn_min_std: 0.1
grad_heads: [decoder, reward, cont]
units: 512
act: SiLU
norm: True
reward_head: {layers: 2, dist: symlog_disc, loss_scale: 1.0, outscale: 0.0}
cont_head: {layers: 2, loss_scale: 1.0, outscale: 1.0}
dyn_scale: 0.5
rep_scale: 0.1
kl_free: 1.0
weight_decay: 0.0
unimix_ratio: 0.01
initial: learned
discount: 0.997          # only used if "discount" is present in a batch (it is: all-ones from our adapter)

# Training (REAL-RUN values; smoke_train_wm.py overrides batch_size/
# batch_length/steps down for the tiny smoke so it stays seconds-long).
batch_size: 16
batch_length: 64
model_lr: 1.0e-4
opt_eps: 1.0e-8
grad_clip: 1000
opt: adam
dataset_size: 1000000
train_steps: 2000          # world-model-only steps for a "real" offline run

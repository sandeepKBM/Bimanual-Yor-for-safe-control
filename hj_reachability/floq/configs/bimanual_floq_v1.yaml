# Real-scale FLOQ config for bimanual arm-arm avoidance.
# Dataset: hj_reachability/floq/datasets/bimanual_v1 (4000 episodes, up to 60
# steps, generated by rollout_dataset.py as part of train_floq.sbatch) --
# built into a FLOQ tensor cache by ur5e_benchmark.floq.dataset itself
# (dataset_cache_dir below), same mechanism as VLAism's floq_v1_cup.yaml.
run_name: bimanual_floq_v1
runs_root: /common/users/ss5772/bimanual/hj_reachability/floq/outputs/runs

source_roots:
  - /common/users/ss5772/bimanual/hj_reachability/floq/datasets/bimanual_v1
dataset_cache_dir: /common/users/ss5772/bimanual/hj_reachability/floq/datasets/bimanual_v1_cache

seed: 20260906
device: cuda

model_type: floq
q_mode: both
horizons: [10, 25, 50]

synthetic_smoke: false
feature_key: state_feature_order
action_key: none
task_filter: both
feature_alignment_mode: intersection
use_target_is_safe_fallback: true
drop_censored: true

batch_size: 256
epochs: 15
max_train_batches: 0
learning_rate: 0.001
weight_decay: 0.0001
clip_grad: 1.0

cond_dim: 128
cond_hidden_dim: 256
flow_hidden_dim: 256
q_hidden_dim: 256
cond_layers: 3
flow_layers: 3
q_layers: 3
dropout: 0.1
activation: gelu
flow_steps: 16
flow_samples: 1
# Lowered 8 -> 2 (2026-09-06, DDP relaunch): eval_flow_samples only affects
# evaluate_floq_model's flow-sampling cost at eval time -- training always
# uses flow_samples=1 above, so this does NOT change the learned value
# function/loss math, only how many flow-ODE samples are averaged when
# scoring val/test. Empirically the full-split eval at eval_flow_samples=8
# (not the ~1.4k train batches/epoch) dominated wall clock in the
# single-GPU runs (272949/273001/273272); this is one of two eval-cost
# fixes applied alongside DDP-sharded eval (see train_bimanual_floq_ddp.py).
eval_flow_samples: 2

lambda_q: 1.0
lambda_flow: 1.0
lambda_td: 1.0
lambda_mono: 0.05
use_td_loss: true
use_horizon_monotonicity_loss: true
td_gamma: 0.99   # FLOQ's own default (utils/losses.py compute_floq_losses)

# FLOQ smoke config for bimanual arm-arm avoidance.
# Dataset: hj_reachability/floq/datasets/smoke_v0 (20 episodes, 30 steps,
# generated by rollout_dataset.py) -- built into a FLOQ tensor cache by
# ur5e_benchmark.floq.dataset.build_floq_dataset_cache itself (dataset_cache_dir
# below), same as the VLAism repo's own floq_v1_*.yaml configs.
run_name: bimanual_floq_smoke
runs_root: /common/users/ss5772/bimanual/hj_reachability/floq/outputs/runs

source_roots:
  - /common/users/ss5772/bimanual/hj_reachability/floq/datasets/smoke_v0
dataset_cache_dir: /common/users/ss5772/bimanual/hj_reachability/floq/datasets/smoke_v0_cache

seed: 7
device: cuda   # CUDA_VISIBLE_DEVICES pins the physical GPU; this stays "cuda"

model_type: floq
q_mode: both
horizons: [5, 10, 20]

synthetic_smoke: false
feature_key: state_feature_order
action_key: none
task_filter: both
feature_alignment_mode: intersection
use_target_is_safe_fallback: true
drop_censored: true

batch_size: 32
epochs: 2
max_train_batches: 2
learning_rate: 0.001
weight_decay: 0.0001
clip_grad: 1.0

cond_dim: 64
cond_hidden_dim: 128
flow_hidden_dim: 128
q_hidden_dim: 128
cond_layers: 2
flow_layers: 2
q_layers: 2
dropout: 0.1
activation: gelu
flow_steps: 8
flow_samples: 1
eval_flow_samples: 4

lambda_q: 1.0
lambda_flow: 1.0
lambda_td: 1.0
lambda_mono: 0.05
use_td_loss: true
use_horizon_monotonicity_loss: true
td_gamma: 0.99   # FLOQ's own default (utils/losses.py compute_floq_losses); the
                 # discounted-safety-Bellman backup for our reachability problem
